# Render Blueprint: set Web Service root to backend/ so requirements.txt resolves.
# https://render.com/docs/monorepo-support
services:
  - type: web
    name: magi-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.11"
      # OpenRouter free tier can exceed 20s per node; align with frontend SSE idle default.
      - key: MAGI_NODE_TIMEOUT
        value: "120"
