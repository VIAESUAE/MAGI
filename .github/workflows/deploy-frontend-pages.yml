# Builds frontend and publishes to GitHub Pages when you push to main.
# Prerequisite: In repo Settings → Secrets and variables → Actions,
#   add secret VITE_API_BASE = https://YOUR-SERVICE.onrender.com
# In Settings → Pages → Build and deployment → Source: GitHub Actions.
#
# VITE_BASE_PATH is /REPO/ from the repository name (project page https://user.github.io/REPO/).

name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-frontend-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build
        working-directory: frontend
        env:
          VITE_API_BASE: ${{ secrets.VITE_API_BASE }}
          # project pages: https://x.github.io/REPO/  →  JS/CSS under /REPO/ (avoids black screen)
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
        run: npm ci && npm run build
      - uses: actions/upload-pages-artifact@v4
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
